name: CI

on:
  push:
    branches: [experiments, main]
  pull_request:

jobs:
  # Suite de tests : PHPUnit (Unit + Integration) sur base MySQL 8 dédiée CI.
  tests:
    name: Tests (PHP 8.3 / MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: aeic_test
          MYSQL_USER: aeic
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --user=root --password=ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Mêmes noms de variables que phpunit.xml / TestDatabaseTrait / IntegrationTestCase.
    # APP_ENV, APP_DEBUG, APP_URL et APP_TESTING sont déjà fixés par phpunit.xml.
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: aeic_test
      DB_USER: aeic
      DB_PASS: ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd, intl
          coverage: none
          cache: composer

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      # Le bootstrap ne crée pas le schéma : les tests sautent si la base est vide.
      # Installation fraîche = database/schema.sql uniquement (les migrations sont
      # déjà intégrées au schéma canonique, voir database/migrations/README.md).
      - name: Préparer la base aeic_test
        run: |
          mysql -h127.0.0.1 -uroot -pci_root -e "
            CREATE DATABASE IF NOT EXISTS aeic_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS 'aeic'@'%' IDENTIFIED BY 'ci_password';
            GRANT ALL PRIVILEGES ON aeic_test.* TO 'aeic'@'%';
            FLUSH PRIVILEGES;"
          mysql -h127.0.0.1 -uroot -pci_root --default-character-set=utf8mb4 aeic_test < database/schema.sql

      - name: Lancer PHPUnit
        run: vendor/bin/phpunit --no-coverage

  # Lint : syntaxe PHP de tous les sources + tests JS (sans dépendance npm).
  lint:
    name: Lint PHP + JS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: php -l sur tous les fichiers PHP
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { echo "::error::Syntaxe PHP invalide : $f"; fail=1; }
          done < <(find app views public tests -name '*.php' -print0)
          exit $fail

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests JS (assert natif, aucune dépendance)
        run: |
          node tests/js/compta-saisie.test.js
          node tests/js/inventaire-tablette.test.js
